name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.0). Leave blank to auto-generate."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Restore or Create Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -storetype PKCS12 \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -alias androiddebugkey \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Prepare Google Services Config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "Writing app/google-services.json from GOOGLE_SERVICES_JSON secret."
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "Writing app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json
            else
              echo "::error::Missing app/google-services.json in the repository. Push app/google-services.json to GitHub or add it as the GOOGLE_SERVICES_JSON GitHub Actions secret so Firebase initializes properly."
              exit 1
            fi
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true" -Dorg.gradle.workers.max=2

      - name: Prepare Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ runner.temp }}/upload-keystore.jks"
          rm -f "$KEYSTORE_FILE"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Using release signing keystore from GitHub Secrets."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::notice::GitHub Secrets ANDROID_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD are not set. Generating a temporary signing keystore for this release APK."
            TEMP_PASS="bagacay_release_temp"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias upload \
              -storepass "$TEMP_PASS" \
              -keypass "$TEMP_PASS" \
              -dname "CN=SCIENTISTS of Bagacay ES, OU=Bagacay ES, O=Bagacay ES, L=Bagacay, ST=Antique, C=PH"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true" -Dorg.gradle.workers.max=2 --stacktrace

      - name: Collect Release APK
        run: |
          mkdir -p build-apks
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$RELEASE_APK" && cp "$RELEASE_APK" build-apks/scientists-of-bagacay-es-release.apk
          ls -lh build-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: scientists-of-bagacay-es-release-apk
          path: build-apks/scientists-of-bagacay-es-release.apk
          retention-days: 30

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag_name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release with APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build-apks/*.apk --clobber
          else
            gh release create "$RELEASE_TAG" build-apks/*.apk \
              --title "SCIENTISTS of Bagacay ES $RELEASE_TAG" \
              --generate-notes
          fi
